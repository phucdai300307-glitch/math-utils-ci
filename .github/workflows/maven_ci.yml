name: Automated Code Review & Quality Control

on:
  # THAY ĐỔI 1: Chuyển sang trigger Pull Request vào nhánh main
  pull_request:
    branches: [ "main" ]
  # Vẫn giữ push trên bai7 để bạn kiểm tra nội bộ nếu muốn
  push:
    branches: [ "bai7" ]

jobs:
  build:
    strategy:
      matrix:
        # Ở Bài 7, để Bot comment không bị trùng lặp 3 lần,
        # ta có thể chỉ cần chạy Checkstyle trên Ubuntu là đủ.
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test and Checkstyle
        # Lệnh verify sẽ chạy cả Unit Test, JaCoCo (80%) và Checkstyle (validate)
        run: mvn clean verify

      # THAY ĐỔI 2: Tích hợp Bot tự động để lại bình luận lỗi (Inline Feedback)
      # Bước này chỉ chạy trên Linux để tránh spam comment từ nhiều OS
      - name: Checkstyle Review Comments
        uses: dbelyaev/action-checkstyle@master
        if: failure()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/