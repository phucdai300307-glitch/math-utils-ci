name: Multi-OS Testing with Matrix Strategy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      # Ma trận này sẽ tạo ra 3 jobs chạy song song
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean package