name: JaCoCo Test Coverage & Quality Enforcement

on:
  push:
    # Đổi thành bai5 để GitHub Actions chạy khi bạn push vào nhánh mới
    branches: [ "bai5" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Verify with JaCoCo
        # Sử dụng 'verify' thay vì 'package' để kích hoạt jacoco:check (80%)
        run: mvn clean verify

      - name: Upload JaCoCo Report
        # Dùng if: always() để đảm bảo báo cáo vẫn được upload kể cả khi test fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Tên artifact riêng biệt cho từng hệ điều hành để không bị đè lên nhau
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/